[accessibility]
ui_scale = 1.0500000081956387

[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    center = [ "workspaces", "media" ]
    end = [ "tray", "group:g2", "group:g1" ]
    font_family = "Zed Mono Extrabold"
    font_weight = 800
    position = "left"
    start = [ "group:g3", "clock" ]
    widget_spacing = 8

        [bar.default.monitor.HDMI-A-1]
        enabled = false

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "notifications", "session" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "network", "volume", "bluetooth" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "control-center", "launcher" ]
        opacity = 1.0
        padding = 6.0

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 688.0
    cx = 360.0
    cy = 1098.0
    output = "HDMI-A-1"
    placement_height = 1280.0
    placement_width = 720.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[notification]
layer = "overlay"
offset_y = 20

[osd]
background_opacity = 0.95999997854232788
offset_y = 20
position = "bottom_center"
position_vertical = "center_right"

[shell]
font_family = "更纱黑体 SC Light"
lang = "zh-Hans"
panel_anchor_bar = "default"

    [shell.launcher]
    auto_paste = "ctrl_shift_v"

    [shell.panel]
    floating_layer = "top"
    launcher_placement = "attached"
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true

    [shell.screen_corners]
    enabled = true
    size = 24

    [shell.shadow]
    direction = "down_right"

[theme]
builtin = "Catppuccin"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper]
per_monitor_directories = true

    [wallpaper.default]
    path = "/home/Myron/Pictures/Wallpapers/攀岩.png"

    [wallpaper.last]
    path = "/home/Myron/Pictures/Wallpapers/攀岩.png"

    [wallpaper.monitors.DP-2]
    path = "/home/Myron/Pictures/Wallpapers/攀岩.png"

[widget.control-center]
glyph = "cat"

[widget.network]
show_label = false

[widget.tray]
drawer = true
pinned = [ """Clash Party
模式: 规则模式
系统代理: 关闭
虚拟网卡: 开启""" ]

[widget.volume]
show_label = false

[widget.workspaces]
anchor = true
style = "minimal"
