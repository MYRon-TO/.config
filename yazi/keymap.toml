# A TOML linter such as https://github.com/tombi-toml/tombi can use this schema to validate your config.
# If you encounter any problems, please make an issue at https://github.com/yazi-rs/schemas.

#:schema https://yazi-rs.github.io/schemas/keymap.json

# Migration for yazi 26.8.15.
# Contains only mappings that differ from the built-in defaults.
# `keymap` and `prepend_keymap` are both declared inline under [mgr] (single style, no mixing).

[mgr]

prepend_keymap = [

	# Hopping (custom: 10-line jumps)
	{ on = "<C-k>", run = "arrow -10", desc = "Move cursor up" },
	{ on = "<C-j>", run = "arrow 10",  desc = "Move cursor down" },

	# Goto (custom; `g f` is left to the default `follow`)
	{ on = [ "g", "l" ], run = "cd ~/.local",                                             desc = "Goto ~/.local" },
	{ on = [ "g", "D" ], run = "cd ~/Desktop/",                                           desc = "Go to the desktop directory" },
	{ on = [ "g", "p" ], run = "cd ~/Pictures/",                                          desc = "Go to the pictures directory" },
	{ on = [ "g", "G" ], run = "cd ~/Git/",                                               desc = "Go to the git directory" },
	{ on = [ "g", "F" ], run = "cd ~/Documents/Obsidian_Vault/Knowledge_Lake/Fragments/", desc = "Go to the obsidian directory" },
	{ on = [ "g", "v" ], run = "cd ~/Documents/Obsidian_Vault/VocabularyBook",            desc = "Go to the vocabulary book directory" },
	{ on = [ "g", "m" ], run = "cd /run/media/",                                          desc = "Go to the media directory" },
	{ on = [ "g", "r" ], run = "cd /",                                                    desc = "Go to the root directory" },
	{ on = [ "g", "t" ], run = "cd /run/media/",                                          desc = "Go to the media directory" },

	# Tabs: keep single-key `t`; the default [t,t] create and [t,r] rename are shadowed
	{ on = "t", run = "tab_create --current", desc = "Create a new tab with CWD" },

	{ on = "<C-d>", run = "plugin diff",             desc = "Diff the selected with the hovered file" },
	{ on = [ "C" ], run = "plugin ouch --args=zip",  desc = "Compress with ouch" },
]
